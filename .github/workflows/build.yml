name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore SvgLiveEditor.sln

      - name: Build Release
        run: dotnet build SvgLiveEditor.sln --configuration Release --no-restore

      - name: Run deterministic tests
        run: dotnet test SvgLiveEditor.sln --configuration Release --no-build --filter "TestCategory!=DesktopIntegration" --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore
          retention-days: 7