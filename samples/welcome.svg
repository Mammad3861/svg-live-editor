<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 440" role="img" aria-labelledby="title description">
  <title id="title">SvgLiveEditor welcome workflow</title>
  <desc id="description">An original four-step workflow from idea to saved SVG.</desc>
  <rect width="1040" height="440" rx="32" style="fill:#f8fafc" />
  <circle cx="920" cy="72" r="92" fill="#60a5fa" opacity="0.18" />
  <circle cx="112" cy="382" r="126" fill="#34d399" opacity="0.14" />

  <text x="64" y="72" fill="#0f172a" font-family="Segoe UI, sans-serif" font-size="34" font-weight="700">SvgLiveEditor</text>
  <text x="64" y="108" fill="#475569" font-family="Segoe UI, sans-serif" font-size="17">Write source. See the result. Keep your work local.</text>

  <g font-family="Segoe UI, sans-serif">
    <rect x="64" y="166" width="190" height="150" rx="20" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" />
    <circle cx="159" cy="211" r="22" fill="#f59e0b" opacity="0.24" />
    <path d="M151 211h16M159 203v16" fill="none" stroke="#92400e" stroke-width="3" stroke-linecap="round" />
    <text x="159" y="265" text-anchor="middle" fill="#78350f" font-size="22" font-weight="700">Idea</text>
    <text x="159" y="292" text-anchor="middle" fill="#92400e" font-size="14">Start with a shape</text>

    <rect x="306" y="166" width="190" height="150" rx="20" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" />
    <path d="M382 208h38M382 220h56M382 232h46" fill="none" stroke="#1d4ed8" stroke-width="4" stroke-linecap="round" />
    <text x="401" y="265" text-anchor="middle" fill="#1e3a8a" font-size="22" font-weight="700">Edit SVG</text>
    <text x="401" y="292" text-anchor="middle" fill="#1d4ed8" font-size="14">Change the XML</text>

    <rect x="548" y="166" width="190" height="150" rx="20" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2" />
    <rect x="600" y="198" width="86" height="48" rx="8" fill="#8b5cf6" opacity="0.22" />
    <circle cx="623" cy="222" r="10" fill="#7c3aed" />
    <path d="M642 232l13-16 15 16z" fill="#6d28d9" />
    <text x="643" y="265" text-anchor="middle" fill="#4c1d95" font-size="22" font-weight="700">Live Preview</text>
    <text x="643" y="292" text-anchor="middle" fill="#6d28d9" font-size="14">Review every change</text>

    <rect x="790" y="166" width="190" height="150" rx="20" fill="#d1fae5" stroke="#10b981" stroke-width="2" />
    <path d="M859 199h52v47h-52zM868 199v17h33v-17M871 229h28" fill="none" stroke="#047857" stroke-width="3" stroke-linejoin="round" />
    <text x="885" y="265" text-anchor="middle" fill="#064e3b" font-size="22" font-weight="700">Save</text>
    <text x="885" y="292" text-anchor="middle" fill="#047857" font-size="14">Keep UTF-8 intact</text>

    <path d="M264 241h30m-10-10 10 10-10 10M506 241h30m-10-10 10 10-10 10M748 241h30m-10-10 10 10-10 10"
          fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

    <rect x="369" y="350" width="302" height="54" rx="27" fill="#0f172a" opacity="0.94" />
    <text x="520" y="385" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" fill="#ffffff" font-size="22">سلام SVG</text>
  </g>
</svg>
